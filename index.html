<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cris Estampa - Customizador y Gestor de Taller</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              crisDark: "#132A20",
              crisCard: "#1C3B2E",
              crisAccent: "#E8DCC4",
              crisGold: "#D4A373",
            },
          },
        },
      };
    </script>
    <!-- Script oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://wgxvnbhkiaiewasueneo.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_s0RkJLZu1gmIyJ2Xcon5Xg_ErgG5vZP";
      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      function masterApp() {
        return {
          sesionIniciada: false,
          abrirModalLogin: false,
          cargandoLogin: false,
          emailLogin: "",
          passwordLogin: "",
          recordarme: true,
          
          seccionActiva: 'customizador',
          productos: [],
          pedidos: [],
          clientes: [],
          gastos: [],
          inventario: [],
          mensaje: "",
          
          // Estados del Customizador Público
          tipoPrenda: 'Remeras Adulto',
          colorPrenda: 'Negro',
          colorHex: '#111111',
          talleSeleccionado: 'L',
          
          vistaPrevisualizacion: 'frente', // 'frente' o 'dorso'
          
          // Configuración de Frente (Valores originales restaurados)
          imagenFrente: null,
          anchoFrenteCm: 20,
          posicionXFrente: 0,
          posicionYFrente: 0,

          // Configuración de Dorso (Valores originales restaurados)
          imagenDorso: null,
          anchoDorsoCm: 25,
          posicionXDorso: 0,
          posicionYDorso: 0,

          observacionesDiseño: '',

          // Paleta de colores filtrada
          coloresPorPrenda() {
            switch(this.tipoPrenda) {
              case 'Remeras Adulto':
                return [
                  { nombre: 'Blanco', hex: '#ffffff' },
                  { nombre: 'Melange Medio', hex: '#9ca3af' },
                  { nombre: 'Melange Oscuro', hex: '#374151' },
                  { nombre: 'Negro', hex: '#111111' },
                  { nombre: 'Azul Marino', hex: '#1e3a8a' },
                  { nombre: 'Azul Francia', hex: '#2563eb' },
                  { nombre: 'Azul Aero', hex: '#3b82f6' },
                  { nombre: 'Crema', hex: '#fef08a' },
                  { nombre: 'Rojo', hex: '#dc2626' },
                  { nombre: 'Lila', hex: '#c4b5fd' },
                  { nombre: 'Violeta', hex: '#7c3aed' },
                  { nombre: 'Amarillo Reactivo', hex: '#facc15' },
                  { nombre: 'Wine', hex: '#831843' },
                  { nombre: 'Naranja Pop', hex: '#f97316' }
                ];
              case 'Remeras Niños':
                return [
                  { nombre: 'Blanco', hex: '#ffffff' }, { nombre: 'Negro', hex: '#111111' },
                  { nombre: 'Melange Claro', hex: '#d1d5db' }, { nombre: 'Melange Oscuro', hex: '#374151' },
                  { nombre: 'Azul Marino', hex: '#1e3a8a' }, { nombre: 'Azul Francia', hex: '#2563eb' },
                  { nombre: 'Azul Aero', hex: '#3b82f6' }, { nombre: 'Lila', hex: '#c4b5fd' },
                  { nombre: 'Rosa', hex: '#fbcfe8' }, { nombre: 'Coral', hex: '#fda4af' },
                  { nombre: 'Rojo', hex: '#dc2626' }, { nombre: 'Amarillo Pastel', hex: '#fef08a' },
                  { nombre: 'Verde Militar', hex: '#3f6212' }, { nombre: 'Verde Bosque', hex: '#065f46' }
                ];
              case 'Musculosas':
                return [
                  { nombre: 'Blanco', hex: '#ffffff' }, { nombre: 'Negro', hex: '#111111' },
                  { nombre: 'Rojo', hex: '#dc2626' }, { nombre: 'Melange Claro', hex: '#d1d5db' },
                  { nombre: 'Violeta', hex: '#7c3aed' }, { nombre: 'Chocolate', hex: '#78350f' },
                  { nombre: 'Verde Militar', hex: '#3f6212' }, { nombre: 'Verde Bosque', hex: '#065f46' },
                  { nombre: 'Azul Francia', hex: '#2563eb' }, { nombre: 'Crema', hex: '#fef08a' },
                  { nombre: 'Amarillo Pastel', hex: '#fef08a' }, { nombre: 'Rosa', hex: '#fbcfe8' },
                  { nombre: 'Coral', hex: '#fda4af' }
                ];
              case 'Buzo Cuello Redondo':
                return [
                  { nombre: 'Blanco', hex: '#ffffff' }, { nombre: 'Negro', hex: '#111111' },
                  { nombre: 'Melange Claro', hex: '#d1d5db' }, { nombre: 'Melange Medio', hex: '#9ca3af' },
                  { nombre: 'Melange Oscuro', hex: '#374151' }, { nombre: 'Azul Marino', hex: '#1e3a8a' }
                ];
              case 'Buzo Canguro':
                return [
                  { nombre: 'Negro', hex: '#111111' }, { nombre: 'Melange Claro', hex: '#d1d5db' },
                  { nombre: 'Melange Medio', hex: '#9ca3af' }, { nombre: 'Melange Oscuro', hex: '#374151' },
                  { nombre: 'Crema', hex: '#fef08a' }, { nombre: 'Azul Marino', hex: '#1e3a8a' },
                  { nombre: 'Verde Bosque', hex: '#065f46' }, { nombre: 'Verde Militar', hex: '#3f6212' },
                  { nombre: 'Chocolate', hex: '#78350f' }, { nombre: 'Bordo', hex: '#831843' }
                ];
              case 'Bolsas Tote Bags':
                return [
                  { nombre: 'Natural / Crudo', hex: '#fdfbf7' }, { nombre: 'Negro', hex: '#111111' }
                ];
              default:
                return [{ nombre: 'Negro', hex: '#111111' }];
            }
          },

          tallesDisponibles() {
            if (this.tipoPrenda === 'Remeras Niños') {
              return ['4', '6', '8', '10', '12', '14', '16'];
            } else if (this.tipoPrenda === 'Bolsas Tote Bags') {
              return ['Único'];
            } else {
              return ['S', 'M', 'L', 'XL', 'XXL'];
            }
          },

          actualizarTipoPrenda() {
            let cols = this.coloresPorPrenda();
            this.colorPrenda = cols[0].nombre;
            this.colorHex = cols[0].hex;
            let talles = this.tallesDisponibles();
            this.talleSeleccionado = talles[0];
          },

          seleccionarColor(c) {
            this.colorPrenda = c.nombre;
            this.colorHex = c.hex;
          },

          cargarImagenFrente(event) {
            const file = event.target.files[0];
            if (file) {
              this.imagenFrente = URL.createObjectURL(file);
            }
          },

          cargarImagenDorso(event) {
            const file = event.target.files[0];
            if (file) {
              this.imagenDorso = URL.createObjectURL(file);
            }
          },

          enviarPedidoWhatsApp() {
            let texto = `Hola Cris! Estuve armando este diseño en la web de Cris Estampa:\n\n`;
            texto += `*Prenda:* ${this.tipoPrenda} (${this.colorPrenda})\n`;
            texto += `*Talle:* ${this.talleSeleccionado}\n\n`;
            
            if (this.imagenFrente) {
              texto += `*FRENTE:* Estampa de ${this.anchoFrenteCm} cm de ancho (Pos X: ${this.posicionXFrente}px, Y: ${this.posicionYFrente}px)\n`;
            }
            if (this.imagenDorso) {
              texto += `*DORSO:* Estampa de ${this.anchoDorsoCm} cm de ancho (Pos X: ${this.posicionXDorso}px, Y: ${this.posicionYDorso}px)\n`;
            }
            
            if (this.observacionesDiseño) {
              texto += `\n*Notas:* ${this.observacionesDiseño}\n`;
            }
            texto += `\nTe envío los detalles para coordinar el pedido. ¡Gracias!`;
            
            let tuNumero = "5493413457465"; 
            
            let url = `https://wa.me/${tuNumero}?text=` + encodeURIComponent(texto);
            window.open(url, '_blank');
          },

          async init() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
              this.sesionIniciada = true;
              await this.cargarDatosCompletos();
            }

            supabaseClient.auth.onAuthStateChange(async (event, session) => {
              if (session) {
                this.sesionIniciada = true;
                await this.cargarDatosCompletos();
              } else {
                this.sesionIniciada = false;
              }
            });
          },

          async iniciarSesion() {
            this.cargandoLogin = true;
            try {
              const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: this.emailLogin,
                password: this.passwordLogin,
              });
              if (error) throw error;
              
              this.sesionIniciada = true;
              this.abrirModalLogin = false;
              this.seccionActiva = 'calculadora';
              await this.cargarDatosCompletos();
              this.mensaje = "¡Bienvenido al panel de Cris Estampa!";
              setTimeout(() => (this.mensaje = ""), 3000);
            } catch (e) {
              console.error("Error de autenticación:", e.message);
              alert("Error al iniciar sesión. Verificá tu correo y contraseña.");
            } finally {
              this.cargandoLogin = false;
            }
          },

          async cerrarSesion() {
            await supabaseClient.auth.signOut();
            this.sesionIniciada = false;
            this.seccionActiva = 'customizador';
            this.emailLogin = "";
            this.passwordLogin = "";
          },

          async cargarDatosCompletos() {
            await this.cargarProductos();
            await this.cargarClientes();
            await this.cargarPedidos();
            await this.cargarGastos();
            await this.cargarInventario();
          },

          async cargarProductos() {
            try {
              let { data, error } = await supabaseClient.from("productos").select("*");
              if (error) throw error;
              this.productos = data.map((p) => ({
                id: p.id,
                nombre: p.nombre,
                costoPrenda: p.costo_prenda,
                costoDtf: p.costo_dtf,
                costoPackaging: p.costo_packaging,
                multiplicador: p.multiplicador,
                cantidad: 1
              }));
            } catch (e) { console.error(e); }
          },

          async cargarClientes() {
            try {
              let { data, error } = await supabaseClient.from("clientes").select("*").order("nombre");
              if (error) throw error;
              this.clientes = data || [];
            } catch (e) { console.error(e); }
          },

          async cargarPedidos() {
            try {
              let { data, error } = await supabaseClient.from("pedidos").select("*, clientes(nombre, telefono, localidad, zona)").order("fecha_creacion", { ascending: false });
              if (error) throw error;
              this.pedidos = data || [];
            } catch (e) { console.error(e); }
          },

          async cargarGastos() {
            try {
              let { data, error } = await supabaseClient.from("gastos").select("*").order("fecha", { ascending: false });
              if (error) throw error;
              this.gastos = data || [];
            } catch (e) { console.error(e); }
          },

          async cargarInventario() {
            try {
              let { data, error } = await supabaseClient.from("inventario").select("*").order("item");
              if (error) throw error;
              this.inventario = data || [];
            } catch (e) { console.error(e); }
          },

          calcularCostoUnitario(p) { return (Number(p.costoPrenda) || 0) + (Number(p.costoDtf) || 0) + (Number(p.costoPackaging) || 0); },
          calcularPrecioUnitario(p) { return this.calcularCostoUnitario(p) * (Number(p.multiplicador) || 2.0); },
          calcularCostoTotal(p) { return this.calcularCostoUnitario(p) * (Number(p.cantidad) || 1); },
          calcularPrecioTotal(p) { return this.calcularPrecioUnitario(p) * (Number(p.cantidad) || 1); },
          calcularGananciaTotal(p) { return this.calcularPrecioTotal(p) - this.calcularCostoTotal(p); },

          formatMoney(val) { return "$ " + Math.round(val || 0).toLocaleString("es-AR"); },

          get totalVentas() { return this.pedidos.reduce((acc, p) => acc + Number(p.total || 0), 0); },
          get totalSeñasRecibidas() { return this.pedidos.reduce((acc, p) => acc + Number(p.seña || 0), 0); },
          get totalSaldoPendiente() { return this.pedidos.reduce((acc, p) => acc + (Number(p.total || 0) - Number(p.seña || 0)), 0); },
          get totalGastos() { return this.gastos.reduce((acc, g) => acc + Number(g.monto || 0), 0); },
          get gananciaNeta() { return this.totalVentas - this.totalGastos; },

          async guardarCambios() {
            try {
              for (let p of this.productos) {
                await supabaseClient.from("productos").update({
                  costo_prenda: p.costoPrenda, costo_dtf: p.costoDtf, costo_packaging: p.costoPackaging, multiplicador: p.multiplicador
                }).eq("id", p.id);
              }
              this.mensaje = "¡Precios y packaging actualizados!";
              setTimeout(() => (this.mensaje = ""), 3500);
            } catch (e) { alert("Error al guardar precios."); }
          },

          abrirCrearPedido() { this.modoEdicionPedido = false; this.nuevo = { cliente_id: "", detalle: "", seña: 0, total: 0, etiqueta: "General", link_carpeta: "" }; this.abrirModalPedido = true; },
          prepararEdicionPedido(p) { this.modoEdicionPedido = true; this.pedidoIdEditando = p.id; this.nuevo = { cliente_id: p.cliente_id || "", detalle: p.detalle, seña: p.seña, total: p.total, etiqueta: p.etiqueta, link_carpeta: p.link_carpeta || "" }; this.abrirModalPedido = true; },
          
          async guardarPedido() {
            let payload = { cliente_id: this.nuevo.cliente_id || null, detalle: this.nuevo.detalle, seña: Number(this.nuevo.seña) || 0, total: Number(this.nuevo.total) || 0, etiqueta: this.nuevo.etiqueta || 'General', link_carpeta: this.nuevo.link_carpeta.trim() || null };
            if (this.modoEdicionPedido) {
              await supabaseClient.from("pedidos").update(payload).eq("id", this.pedidoIdEditando);
            } else {
              payload.estado = 'Pendiente';
              await supabaseClient.from("pedidos").insert([payload]);
            }
            this.abrirModalPedido = false;
            await this.cargarPedidos();
          },
          async eliminarPedido(id) { if (confirm("¿Eliminar pedido?")) { await supabaseClient.from("pedidos").delete().eq("id", id); await this.cargarPedidos(); } },

          abrirCrearCliente() { this.modoEdicionCliente = false; this.nuevoCliente = { nombre: "", telefono: "", email: "", localidad: "Rosario", zona: "", notas: "" }; this.abrirModalCliente = true; },
          prepararEdicionCliente(c) { this.modoEdicionCliente = true; this.clienteIdEditando = c.id; this.nuevoCliente = { ...c }; this.abrirModalCliente = true; },
          async guardarCliente() {
            if (this.modoEdicionCliente) {
              await supabaseClient.from("clientes").update(this.nuevoCliente).eq("id", this.clienteIdEditando);
            } else {
              let { data } = await supabaseClient.from("clientes").insert([this.nuevoCliente]).select();
              if (data) this.nuevo.cliente_id = data[0].id;
            }
            this.abrirModalCliente = false;
            await this.cargarClientes();
          },
          async eliminarCliente(id) { if (confirm("¿Eliminar cliente?")) { await supabaseClient.from("clientes").delete().eq("id", id); await this.cargarClientes(); } },

          async guardarGasto() {
            await supabaseClient.from("gastos").insert([{ concepto: this.nuevoGasto.concepto, monto: Number(this.nuevoGasto.monto) || 0, categoria: this.nuevoGasto.categoria }]);
            this.nuevoGasto = { concepto: "", monto: 0, categoria: "DTF Tercerizado" };
            this.abrirModalGasto = false;
            await this.cargarGastos();
          },
          async eliminarGasto(id) { await supabaseClient.from("gastos").delete().eq("id", id); await this.cargarGastos(); },

          abrirCrearStock() { this.modoEdicionStock = false; this.nuevoItemStock = { item: "", categoria: "Prendas", stock_actual: 0, unidad: "Unidades", stock_minimo: 2 }; this.abrirModalStock = true; },
          prepararEdicionStock(i) { this.modoEdicionStock = true; this.stockIdEditando = i.id; this.nuevoItemStock = { ...i }; this.abrirModalStock = true; },
          async guardarStockItem() {
            let payload = { item: this.nuevoItemStock.item, categoria: this.nuevoItemStock.categoria, stock_actual: Number(this.nuevoItemStock.stock_actual) || 0, unidad: this.nuevoItemStock.unidad, stock_minimo: Number(this.nuevoItemStock.stock_minimo) || 2 };
            if (this.modoEdicionStock) {
              await supabaseClient.from("inventario").update(payload).eq("id", this.stockIdEditando);
            } else {
              await supabaseClient.from("inventario").insert([payload]);
            }
            this.abrirModalStock = false;
            await this.cargarInventario();
          },
          async ajustarStockRapido(i, delta) {
            let nv = Math.max(0, Number(i.stock_actual) + delta);
            i.stock_actual = nv;
            await supabaseClient.from("inventario").update({ stock_actual: nv }).eq("id", i.id);
          },
          async eliminarItemStock(id) { await supabaseClient.from("inventario").delete().eq("id", id); await this.cargarInventario(); },
          async actualizarEstado(p) { await supabaseClient.from("pedidos").update({ estado: p.estado }).eq("id", p.id); }
        };
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="logo.svg?v=2" />
    <link rel="apple-touch-icon" href="logo.png?v=2" />
  </head>
  <body class="bg-crisDark text-crisAccent min-h-screen font-sans antialiased selection:bg-crisGold selection:text-crisDark" x-data="masterApp()">

    <div class="max-w-4xl mx-auto px-4 py-6">
      
      <!-- HEADER PRINCIPAL -->
      <header class="flex flex-col sm:flex-row justify-between items-center mb-6 border-b border-emerald-900/50 pb-6 gap-4">
        <div class="flex items-center gap-3">
          <img src="logo.svg" alt="Cris Estampa Logo" class="w-12 h-12 rounded-2xl shadow-lg object-contain bg-crisAccent/10 p-1" />
          <div>
            <h1 class="text-2xl font-black tracking-wider text-white">
              CRIS <span class="text-crisGold font-medium text-lg">estampa</span>
            </h1>
            <p class="text-xs text-emerald-300/70">Indumentaria Personalizada</p>
          </div>
        </div>

        <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
          <template x-if="!sesionIniciada">
            <div class="flex items-center gap-2">
              <button @click="seccionActiva = 'customizador'" :class="seccionActiva === 'customizador' ? 'bg-crisGold text-crisDark font-bold' : 'bg-crisCard text-emerald-200'" class="px-4 py-2 rounded-xl text-xs transition shadow">
                🎨 Armá tu Diseño
              </button>
              <button @click="abrirModalLogin = true" class="bg-emerald-900/60 hover:bg-emerald-900 text-emerald-200 border border-emerald-700 px-3 py-2 rounded-xl text-xs font-bold transition shadow">
                🔑 Acceso Taller
              </button>
            </div>
          </template>

          <template x-if="sesionIniciada">
            <div class="flex items-center gap-2">
              <button @click="abrirCrearPedido()" class="bg-crisGold hover:bg-[#c29263] text-crisDark px-3 py-2 rounded-xl text-xs font-bold transition shadow">
                + Pedido
              </button>
              <button @click="cerrarSesion()" class="bg-red-950/80 hover:bg-red-900 text-red-300 px-3 py-2 rounded-xl text-xs font-bold transition border border-red-900/60">
                🔒 Salir
              </button>
            </div>
          </template>
        </div>
      </header>

      <!-- BARRA DE PESTAÑAS (ADMIN) -->
      <template x-if="sesionIniciada">
        <div class="flex bg-crisCard p-1.5 rounded-2xl border border-emerald-900/60 mb-6 shadow-xl overflow-x-auto">
          <button @click="seccionActiva = 'customizador'" :class="seccionActiva === 'customizador' ? 'bg-crisDark text-crisGold shadow-md font-bold' : 'text-emerald-300/70 hover:text-white'" class="flex-1 py-2 px-2 rounded-xl text-xs transition text-center uppercase whitespace-nowrap">🎨 Customizador</button>
          <button @click="seccionActiva = 'calculadora'" :class="seccionActiva === 'calculadora' ? 'bg-crisDark text-crisGold shadow-md font-bold' : 'text-emerald-300/70 hover:text-white'" class="flex-1 py-2 px-2 rounded-xl text-xs transition text-center uppercase whitespace-nowrap">🧮 Precios</button>
          <button @click="seccionActiva = 'pedidos'" :class="seccionActiva === 'pedidos' ? 'bg-crisDark text-crisGold shadow-md font-bold' : 'text-emerald-300/70 hover:text-white'" class="flex-1 py-2 px-2 rounded-xl text-xs transition text-center uppercase whitespace-nowrap">📦 Pedidos</button>
          <button @click="seccionActiva = 'clientes'" :class="seccionActiva === 'clientes' ? 'bg-crisDark text-crisGold shadow-md font-bold' : 'text-emerald-300/70 hover:text-white'" class="flex-1 py-2 px-2 rounded-xl text-xs transition text-center uppercase whitespace-nowrap">📇 Clientes</button>
          <button @click="seccionActiva = 'finanzas'" :class="seccionActiva === 'finanzas' ? 'bg-crisDark text-crisGold shadow-md font-bold' : 'text-emerald-300/70 hover:text-white'" class="flex-1 py-2 px-2 rounded-xl text-xs transition text-center uppercase whitespace-nowrap">💱 Finanzas</button>
          <button @click="seccionActiva = 'stock'" :class="seccionActiva === 'stock' ? 'bg-crisDark text-crisGold shadow-md font-bold' : 'text-emerald-300/70 hover:text-white'" class="flex-1 py-2 px-2 rounded-xl text-xs transition text-center uppercase whitespace-nowrap">👕 Stock</button>
        </div>
      </template>

      <!-- MENSAJE FLOTANTE -->
      <div x-show="mensaje" x-transition class="mb-6 p-4 bg-emerald-900/90 border border-emerald-500/40 text-emerald-200 text-sm rounded-2xl text-center shadow-xl" x-text="mensaje"></div>

      <!-- ================= SECCIÓN 0: CUSTOMIZADOR PÚBLICO ================= -->
      <div x-show="seccionActiva === 'customizador'" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- Columna Izquierda: Visualizador Real con Mockups Originales + Exclusivo Tote Bags -->
        <div class="bg-gradient-to-b from-[#1E382E] to-[#122A21] border border-emerald-900/50 rounded-3xl p-6 shadow-2xl flex flex-col items-center justify-center relative min-h-[440px]">
          
          <!-- Selector de Vista (Frente / Dorso) en la parte superior -->
          <div class="absolute top-4 left-4 right-4 flex justify-between items-center px-2 z-30">
            <span class="text-[10px] uppercase font-bold tracking-wider bg-crisDark text-crisGold px-3 py-1 rounded-xl border border-emerald-800 shadow-md" x-text="tipoPrenda + ' (' + colorPrenda + ')'"></span>
            
            <div class="flex bg-crisDark/90 p-1 rounded-xl border border-emerald-800/80 shadow-md">
              <button @click="vistaPrevisualizacion = 'frente'" :class="vistaPrevisualizacion === 'frente' ? 'bg-crisGold text-crisDark font-bold' : 'text-emerald-300/70'" class="px-3 py-1 rounded-lg text-[10px] uppercase transition">Frente</button>
              <button @click="vistaPrevisualizacion = 'dorso'" :class="vistaPrevisualizacion === 'dorso' ? 'bg-crisGold text-crisDark font-bold' : 'text-emerald-300/70'" class="px-3 py-1 rounded-lg text-[10px] uppercase transition">Dorso</button>
            </div>
          </div>
          
          <!-- Contenedor del Mockup -->
          <div class="w-72 h-84 relative flex items-center justify-center mt-12 shadow-2xl rounded-2xl overflow-hidden border border-emerald-700/30 bg-[#162D24]">
            
            <!-- SVG Vectorial ORIGINAL para Remeras y Buzos -->
            <svg x-show="tipoPrenda !== 'Bolsas Tote Bags'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" class="w-full h-full absolute inset-0 z-10 pointer-events-none drop-shadow-2xl">
              <defs>
                <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/></filter>
                <linearGradient id="lighting" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/><stop offset="50%" stop-color="#000000" stop-opacity="0.05"/><stop offset="100%" stop-color="#000000" stop-opacity="0.45"/></linearGradient>
              </defs>
              <g filter="url(#shadow)">
                <path d="M 180 50 Q 250 80 300 80 Q 350 80 420 50 L 480 90 L 540 180 Q 490 200 470 240 L 470 580 Q 470 600 450 600 L 150 600 Q 130 600 130 580 L 130 240 Q 110 200 60 180 L 120 90 Z" :fill="colorHex" stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-linejoin="round" />
                <path d="M 180 50 Q 250 80 300 80 Q 350 80 420 50 L 480 90 L 540 180 Q 490 200 470 240 L 470 580 Q 470 600 450 600 L 150 600 Q 130 600 130 580 L 130 240 Q 110 200 60 180 L 120 90 Z" fill="url(#lighting)" style="mix-blend-mode: overlay;" />
                <path x-show="vistaPrevisualizacion === 'frente'" d="M 180 50 Q 250 140 300 140 Q 350 140 420 50" fill="none" stroke="rgba(0,0,0,0.4)" stroke-width="3.5" />
                <path x-show="vistaPrevisualizacion === 'dorso'" d="M 180 50 Q 250 90 300 90 Q 350 90 420 50" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="3" />
                <path d="M 180 50 L 120 90" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="6,4"/>
                <path d="M 420 50 L 480 90" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="6,4"/>
              </g>
            </svg>

            <!-- SVG Vectorial EXCLUSIVO para Tote Bags -->
            <svg x-show="tipoPrenda === 'Bolsas Tote Bags'" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" class="w-full h-full absolute inset-0 z-10 pointer-events-none drop-shadow-2xl">
              <g filter="url(#shadow)">
                <path d="M 220 180 Q 220 70 300 70 Q 380 70 380 180" fill="none" :stroke="colorHex" stroke-width="22" stroke-linecap="round"/>
                <path d="M 235 180 Q 235 90 300 90 Q 365 90 365 180" fill="none" stroke="#162D24" stroke-width="12" stroke-linecap="round"/>
                <rect x="140" y="180" width="320" height="380" rx="12" :fill="colorHex" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
                <rect x="140" y="180" width="320" height="380" rx="12" fill="url(#lighting)" style="mix-blend-mode: overlay;"/>
              </g>
            </svg>

            <!-- VISTA FRENTE -->
            <div x-show="vistaPrevisualizacion === 'frente'" class="absolute w-36 h-40 flex items-center justify-center overflow-hidden z-20" style="top: 36%;">
              <template x-if="!imagenFrente"><span class="text-[10px] font-bold text-center px-3 py-1.5 text-neutral-200 bg-black/60 backdrop-blur-sm rounded-xl border border-white/20 shadow-xl">Sin estampa (Frente)</span></template>
              <template x-if="imagenFrente"><img :src="imagenFrente" alt="Diseño Frente" class="object-contain transition-all duration-75 drop-shadow-2xl" :style="'width: ' + ((anchoFrenteCm / 32) * 100) + '%; transform: translate(' + posicionXFrente + 'px, ' + posicionYFrente + 'px);'" /></template>
            </div>

            <!-- VISTA DORSO -->
            <div x-show="vistaPrevisualizacion === 'dorso'" class="absolute w-36 h-40 flex items-center justify-center overflow-hidden z-20" style="top: 36%;">
              <template x-if="!imagenDorso"><span class="text-[10px] font-bold text-center px-3 py-1.5 text-neutral-200 bg-black/60 backdrop-blur-sm rounded-xl border border-white/20 shadow-xl">Sin estampa (Dorso)</span></template>
              <template x-if="imagenDorso"><img :src="imagenDorso" alt="Diseño Dorso" class="object-contain transition-all duration-75 drop-shadow-2xl" :style="'width: ' + ((anchoDorsoCm / 32) * 100) + '%; transform: translate(' + posicionXDorso + 'px, ' + posicionYDorso + 'px);'" /></template>
            </div>
            
          </div>
          <span class="text-[10px] mt-3 font-semibold uppercase tracking-widest text-emerald-300/80" x-text="'Vista: ' + vistaPrevisualizacion.toUpperCase()"></span>
        </div>

        <!-- Columna Derecha: Controles del Customizador Originales -->
        <div class="bg-crisCard border border-emerald-900/40 rounded-3xl p-6 shadow-2xl space-y-4 text-xs">
          <h2 class="text-base font-black text-white border-b border-emerald-900/40 pb-2">Armá tu Indumentaria</h2>

          <div>
            <label class="block text-emerald-300/80 mb-1 font-semibold">1. Elegí la prenda o producto</label>
            <select x-model="tipoPrenda" @change="actualizarTipoPrenda()" class="w-full bg-crisDark border border-emerald-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-crisGold">
              <option value="Remeras Adulto">Remeras Adulto (S al XXL)</option>
              <option value="Remeras Niños">Remeras Niños (Talles 4 al 16)</option>
              <option value="Musculosas">Musculosas (S al XXL)</option>
              <option value="Buzo Cuello Redondo">Buzo Cuello Redondo (S al XXL)</option>
              <option value="Buzo Canguro">Buzo Canguro (S al XXL)</option>
              <option value="Bolsas Tote Bags">Bolsas Tote Bags (Tote Bag)</option>
            </select>
          </div>

          <div>
            <label class="block text-emerald-300/80 mb-1.5 font-semibold">2. Color disponible en catálogo</label>
            <div class="flex flex-wrap gap-2 max-h-28 overflow-y-auto p-1 bg-crisDark/40 rounded-xl border border-emerald-900/50">
              <template x-for="c in coloresPorPrenda()">
                <button type="button" @click="seleccionarColor(c)" class="w-8 h-8 rounded-full border-2 transition shadow-md flex items-center justify-center relative group" :class="colorPrenda === c.nombre ? 'border-crisGold scale-110 ring-2 ring-crisGold/50' : 'border-black/30 opacity-90'" :style="'background-color: ' + c.hex" :title="c.nombre"></button>
              </template>
            </div>
            <p class="text-[11px] text-crisGold mt-1 font-medium" x-text="'Color seleccionado: ' + colorPrenda"></p>
          </div>

          <div>
            <label class="block text-emerald-300/80 mb-1 font-semibold">3. Talle</label>
            <div class="flex flex-wrap gap-2">
              <template x-for="t in tallesDisponibles()">
                <button type="button" @click="talleSeleccionado = t" :class="talleSeleccionado === t ? 'bg-crisGold text-crisDark font-bold' : 'bg-crisDark text-emerald-200 border border-emerald-800'" class="px-3 h-9 rounded-xl text-xs transition" x-text="t"></button>
              </template>
            </div>
          </div>

          <!-- Controles de diseño originales (Sliders y posicionamiento intactos) -->
          <div class="space-y-3 p-3 bg-crisDark/50 border border-emerald-900/60 rounded-2xl">
            <label class="block text-emerald-300/90 font-bold text-sm">4. Diseños y Medidas (en cm)</label>
            <div class="border-b border-emerald-900/60 pb-3">
              <span class="text-crisGold font-bold block mb-1">Frente de la prenda</span>
              <input type="file" accept="image/*" @change="cargarImagenFrente" class="w-full bg-crisDark border border-emerald-800 rounded-xl px-2 py-1.5 text-emerald-200 text-[11px] cursor-pointer mb-2" />
              <template x-if="imagenFrente">
                <div class="space-y-2 mt-1">
                  <div>
                    <div class="flex justify-between text-[10px] text-emerald-300/70 mb-0.5">
                      <span>Ancho de estampa:</span><strong class="text-white" x-text="anchoFrenteCm + ' cm'"></strong>
                    </div>
                    <input type="range" min="8" max="32" x-model.number="anchoFrenteCm" class="w-full accent-crisGold cursor-pointer" />
                  </div>
                  <div class="grid grid-cols-2 gap-2 pt-1">
                    <div>
                      <span class="text-[10px] text-emerald-300/70">Mover X: <strong x-text="posicionXFrente + 'px'"></strong></span>
                      <input type="range" min="-30" max="30" x-model.number="posicionXFrente" class="w-full accent-crisGold cursor-pointer" />
                    </div>
                    <div>
                      <span class="text-[10px] text-emerald-300/70">Mover Y: <strong x-text="posicionYFrente + 'px'"></strong></span>
                      <input type="range" min="-30" max="30" x-model.number="posicionYFrente" class="w-full accent-crisGold cursor-pointer" />
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <div class="pt-2">
            <button @click="enviarPedidoWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-bold text-sm transition shadow-lg flex items-center justify-center gap-2">
              <span>Enviar Diseño por WhatsApp</span>
            </button>
          </div>

        </div>
      </div>

      <!-- ================= SECCIÓN 1: CALCULADORA ================= -->
      <div x-show="seccionActiva === 'calculadora'" style="display: none;" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <template x-for="(prod, index) in productos" :key="prod.id">
          <div class="bg-crisCard border border-emerald-900/40 rounded-3xl p-6 shadow-2xl space-y-3">
            <h2 class="text-lg font-bold text-white mb-2 border-b border-emerald-900/40 pb-2" x-text="prod.nombre"></h2>
            
            <div class="grid grid-cols-2 gap-2 text-xs">
              <div><span class="text-emerald-200/70">Costo Prenda ($):</span><input type="number" x-model.number="prod.costoPrenda" class="w-full bg-crisDark border border-emerald-800 rounded-xl p-1.5 text-right text-white font-medium" /></div>
              <div><span class="text-emerald-200/70">Costo DTF ($):</span><input type="number" x-model.number="prod.costoDtf" class="w-full bg-crisDark border border-emerald-800 rounded-xl p-1.5 text-right text-white font-medium" /></div>
              <div><span class="text-emerald-200/70">Packaging ($):</span><input type="number" x-model.number="prod.costoPackaging" class="w-full bg-crisDark border border-emerald-800 rounded-xl p-1.5 text-right text-white font-medium" /></div>
              <div><span class="text-emerald-200/70">Multiplicador:</span><input type="number" step="0.1" x-model.number="prod.multiplicador" class="w-full bg-crisDark border border-emerald-800 rounded-xl p-1.5 text-right text-white font-medium" /></div>
            </div>

            <!-- Cantidad de Unidades -->
            <div class="p-2.5 bg-crisDark/60 rounded-xl border border-emerald-800/60 flex justify-between items-center text-xs mt-2">
              <span class="text-emerald-300 font-bold">Cantidad de Unidades:</span>
              <input type="number" min="1" x-model.number="prod.cantidad" class="w-20 bg-crisCard border border-emerald-700 rounded-lg p-1 text-center text-white font-black text-sm" />
            </div>

            <!-- Desglose de Costo y Ganancia -->
            <div class="mt-4 pt-3 border-t border-emerald-900/40 space-y-1.5 text-xs">
              <div class="flex justify-between text-emerald-300/70">
                <span>Costo Total (Tirada):</span>
                <strong class="text-white" x-text="formatMoney(calcularCostoTotal(prod))"></strong>
              </div>
              <div class="flex justify-between text-crisGold font-bold">
                <span>Ganancia Total Estimada:</span>
                <strong x-text="formatMoney(calcularGananciaTotal(prod))"></strong>
              </div>
              <div class="flex justify-between items-center pt-2 border-t border-emerald-900/20">
                <span class="text-[11px] uppercase text-emerald-300/50">Precio Final Total</span>
                <span class="text-xl font-black text-crisGold" x-text="formatMoney(calcularPrecioTotal(prod))"></span>
              </div>
            </div>
          </div>
        </template>
        <div class="col-span-full flex justify-end mt-2">
          <button @click="guardarCambios()" class="bg-emerald-800 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition shadow-lg">Guardar Precios y Packaging en la Nube</button>
        </div>
      </div>

      <!-- MÓDULOS RESTANTES -->
      <div x-show="seccionActiva === 'pedidos'" style="display: none;"><div class="bg-crisCard p-6 rounded-3xl"><h2 class="text-white font-bold mb-4">Módulo de Pedidos</h2><button @click="abrirCrearPedido()" class="bg-crisGold text-crisDark px-4 py-2 rounded-xl text-xs font-bold">+ Nuevo Pedido</button></div></div>
      <div x-show="seccionActiva === 'clientes'" style="display: none;"><div class="bg-crisCard p-6 rounded-3xl"><h2 class="text-white font-bold mb-4">Agenda de Clientes</h2><button @click="abrirCrearCliente()" class="bg-crisGold text-crisDark px-4 py-2 rounded-xl text-xs font-bold">+ Nuevo Cliente</button></div></div>
      <div x-show="seccionActiva === 'finanzas'" style="display: none;"><div class="bg-crisCard p-6 rounded-3xl"><h2 class="text-white font-bold mb-4">Control de Finanzas</h2></div></div>
      <div x-show="seccionActiva === 'stock'" style="display: none;"><div class="bg-crisCard p-6 rounded-3xl"><h2 class="text-white font-bold mb-4">Gestión de Stock</h2><button @click="abrirCrearStock()" class="bg-crisGold text-crisDark px-4 py-2 rounded-xl text-xs font-bold">+ Nuevo Item</button></div></div>

      <!-- MODALES -->
      <div x-show="abrirModalLogin" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50" style="display: none;">
        <div class="bg-crisCard border border-emerald-900 rounded-3xl p-6 w-full max-w-md relative" @click.away="abrirModalLogin = false">
          <button @click="abrirModalLogin = false" class="absolute top-4 right-4 text-emerald-400 font-bold">✕</button>
          <h3 class="text-lg font-bold text-white mb-4">🔑 Acceso Taller</h3>
          <form @submit.prevent="iniciarSesion()" class="space-y-4 text-xs">
            <div><label class="text-emerald-300 mb-1 block">Correo</label><input type="email" x-model="emailLogin" required class="w-full bg-crisDark border border-emerald-800 rounded-xl p-2 text-white" /></div>
            <div><label class="text-emerald-300 mb-1 block">Contraseña</label><input type="password" x-model="passwordLogin" required class="w-full bg-crisDark border border-emerald-800 rounded-xl p-2 text-white" /></div>
            <button type="submit" class="w-full bg-crisGold text-crisDark py-2.5 rounded-xl font-bold">Ingresar</button>
          </form>
        </div>
      </div>

    </div>
  </body>
</html>
