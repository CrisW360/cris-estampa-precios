<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cris Estampa - Gestor de Taller</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              crisDark: "#132A20",
              crisCard: "#1C3B2E",
              crisAccent: "#E8DCC4",
              crisGold: "#D4A373",
            },
          },
        },
      };
    </script>
    <!-- Script oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://wgxvnbhkiaiewasueneo.supabase.co";
      const SUPABASE_ANON_KEY =
        "sb_publishable_s0RkJLZu1gmIyJ2Xcon5Xg_ErgG5vZP";
      const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
      );

      function masterApp() {
        return {
          seccionActiva: "calculadora", // 'calculadora' o 'pedidos'
          productos: [],
          pedidos: [],
          mensaje: "",
          abrirModal: false,
          nuevo: {
            cliente: "",
            detalle: "",
            seña: 0,
            total: 0,
            etiqueta: "General",
            imagen_url: "",
          },

          async init() {
            await this.cargarProductos();
            await this.cargarPedidos();
          },

          async cargarProductos() {
            try {
              let { data, error } = await supabaseClient
                .from("productos")
                .select("*");
              if (error) throw error;
              this.productos = data.map((p) => ({
                id: p.id,
                nombre: p.nombre,
                costoPrenda: p.costo_prenda,
                costoDtf: p.costo_dtf,
                costoPackaging: p.costo_packaging,
                multiplicador: p.multiplicador,
              }));
            } catch (e) {
              console.error("Error al cargar productos:", e.message);
            }
          },

          async cargarPedidos() {
            try {
              let { data, error } = await supabaseClient
                .from("pedidos")
                .select("*")
                .order("fecha_creacion", { ascending: false });
              if (error) throw error;
              this.pedidos = data || [];
            } catch (e) {
              console.error("Error al cargar pedidos:", e.message);
            }
          },

          calcularTotal(p) {
            return (
              (p.costoPrenda || 0) + (p.costoDtf || 0) + (p.costoPackaging || 0)
            );
          },

          calcularPrecio(p) {
            return this.calcularTotal(p) * (p.multiplicador || 2.0);
          },

          formatMoney(val) {
            return "$ " + Math.round(val).toLocaleString("es-AR");
          },

          async guardarCambios() {
            try {
              for (let p of this.productos) {
                let { error } = await supabaseClient
                  .from("productos")
                  .update({
                    costo_prenda: p.costoPrenda,
                    costo_dtf: p.costoDtf,
                    costo_packaging: p.costoPackaging,
                    multiplicador: p.multiplicador,
                  })
                  .eq("id", p.id);
                if (error) throw error;
              }
              this.mensaje =
                "¡Precios actualizados y sincronizados en la nube!";
              setTimeout(() => (this.mensaje = ""), 3500);
            } catch (e) {
              console.error("Error al guardar en Supabase:", e.message);
              this.mensaje = "Hubo un error al guardar los cambios.";
            }
          },

          async guardarPedido() {
            try {
              let urlImagen = this.nuevo.imagen_url.trim();

              // Automatización: Si pegan un link clásico de Google Drive, lo convertimos a enlace directo
              if (urlImagen.includes("drive.google.com/file/d/")) {
                let match = urlImagen.match(/\/file\/d\/([^\/]+)/);
                if (match && match[1]) {
                  let fileId = match[1];
                  urlImagen = `https://drive.google.com/uc?export=view&id=${fileId}`;
                }
              }

              let payload = {
                cliente: this.nuevo.cliente,
                detalle: this.nuevo.detalle,
                seña: Number(this.nuevo.seña) || 0,
                total: Number(this.nuevo.total) || 0,
                etiqueta: this.nuevo.etiqueta || "General",
                imagen_url: urlImagen || null,
                estado: "Pendiente",
              };

              let { data, error } = await supabaseClient
                .from("pedidos")
                .insert([payload])
                .select();
              if (error) throw error;

              if (data) {
                this.pedidos.unshift(data[0]);
                this.nuevo = {
                  cliente: "",
                  detalle: "",
                  seña: 0,
                  total: 0,
                  etiqueta: "General",
                  imagen_url: "",
                };
                this.abrirModal = false;
                this.mensaje = "¡Pedido guardado con éxito!";
                setTimeout(() => (this.mensaje = ""), 3500);
              }
            } catch (e) {
              console.error("Error al guardar pedido:", e.message);
              alert("Error al guardar el pedido. Verificá los datos.");
            }
          },

          async actualizarEstado(p) {
            await supabaseClient
              .from("pedidos")
              .update({ estado: p.estado })
              .eq("id", p.id);
          },
        };
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="apple-touch-icon" href="logo.svg" />
  </head>
  <body
    class="bg-crisDark text-crisAccent min-h-screen font-sans antialiased selection:bg-crisGold selection:text-crisDark"
    x-data="masterApp()"
  >
    <div class="max-w-4xl mx-auto px-4 py-6">
      <!-- HEADER CON IDENTIDAD Y MENÚ DE NAVEGACIÓN -->
      <header
        class="flex flex-col sm:flex-row justify-between items-center mb-6 border-b border-emerald-900/50 pb-6 gap-4"
      >
        <div class="flex items-center gap-3">
          <img
            src="logo.svg"
            alt="Cris Estampa Logo"
            class="w-12 h-12 rounded-2xl shadow-lg object-contain bg-crisAccent/10 p-1"
          />
          <div>
            <h1 class="text-2xl font-black tracking-wider text-white">
              CRIS
              <span class="text-crisGold font-medium text-lg">estampa</span>
            </h1>
            <p class="text-xs text-emerald-300/70">Gestor Integral de Taller</p>
          </div>
        </div>

        <!-- Botones de Acción Superior / Navegación -->
        <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
          <button
            @click="abrirModal = true"
            class="bg-crisGold hover:bg-[#c29263] text-crisDark px-4 py-2.5 rounded-xl text-sm font-bold transition shadow-lg flex items-center gap-2"
          >
            <span>+ Pedido</span>
          </button>

          <template x-if="seccionActiva === 'calculadora'">
            <button
              @click="guardarCambios()"
              class="bg-emerald-800 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-sm font-bold transition shadow-lg"
            >
              Guardar Precios
            </button>
          </template>
        </div>
      </header>

      <!-- BARRA DE PESTAÑAS (MENÚ) -->
      <div
        class="flex bg-crisCard p-1.5 rounded-2xl border border-emerald-900/60 mb-6 shadow-xl"
      >
        <button
          @click="seccionActiva = 'calculadora'"
          :class="seccionActiva === 'calculadora' ? 'bg-crisDark text-crisGold shadow-md font-bold' : 'text-emerald-300/70 hover:text-white'"
          class="flex-1 py-2.5 rounded-xl text-xs sm:text-sm transition text-center uppercase tracking-wider"
        >
          🧮 Calculadora de Precios
        </button>
        <button
          @click="seccionActiva = 'pedidos'"
          :class="seccionActiva === 'pedidos' ? 'bg-crisDark text-crisGold shadow-md font-bold' : 'text-emerald-300/70 hover:text-white'"
          class="flex-1 py-2.5 rounded-xl text-xs sm:text-sm transition text-center uppercase tracking-wider"
        >
          📦 Seguimiento de Pedidos
        </button>
      </div>

      <!-- MENSAJE DE ÉXITO FLOTANTE -->
      <div
        x-show="mensaje"
        x-transition
        class="mb-6 p-4 bg-emerald-900/90 border border-emerald-500/40 text-emerald-200 text-sm rounded-2xl text-center shadow-xl"
        x-text="mensaje"
      ></div>

      <!-- ================= SECCIÓN 1: CALCULADORA ================= -->
      <div
        x-show="seccionActiva === 'calculadora'"
        class="grid grid-cols-1 md:grid-cols-2 gap-6"
      >
        <template x-for="(prod, index) in productos" :key="prod.id">
          <div
            class="bg-crisCard border border-emerald-900/40 rounded-3xl p-6 shadow-2xl backdrop-blur-md relative overflow-hidden"
          >
            <h2
              class="text-lg font-bold text-white mb-4 border-b border-emerald-900/40 pb-2"
              x-text="prod.nombre"
            ></h2>

            <div class="space-y-3 text-sm">
              <div class="flex justify-between items-center">
                <span class="text-emerald-200/70">Costo Prenda ($):</span>
                <input
                  type="number"
                  x-model.number="prod.costoPrenda"
                  class="bg-crisDark border border-emerald-800/60 rounded-xl px-3 py-1.5 w-32 text-right text-white font-medium focus:outline-none focus:border-crisGold transition"
                />
              </div>
              <div class="flex justify-between items-center">
                <span class="text-emerald-200/70">Costo DTF ($):</span>
                <input
                  type="number"
                  x-model.number="prod.costoDtf"
                  class="bg-crisDark border border-emerald-800/60 rounded-xl px-3 py-1.5 w-32 text-right text-white font-medium focus:outline-none focus:border-crisGold transition"
                />
              </div>
              <div class="flex justify-between items-center">
                <span class="text-emerald-200/70">Packaging ($):</span>
                <input
                  type="number"
                  x-model.number="prod.costoPackaging"
                  class="bg-crisDark border border-emerald-800/60 rounded-xl px-3 py-1.5 w-32 text-right text-white/50 font-medium cursor-not-allowed"
                  disabled
                />
              </div>
              <div class="flex justify-between items-center">
                <span class="text-emerald-200/70">Multiplicador (Margen):</span>
                <input
                  type="number"
                  step="0.1"
                  x-model.number="prod.multiplicador"
                  class="bg-crisDark border border-emerald-800/60 rounded-xl px-3 py-1.5 w-32 text-right text-white font-medium focus:outline-none focus:border-crisGold transition"
                />
              </div>
            </div>

            <!-- Resultados en vivo -->
            <div
              class="mt-6 pt-4 border-t border-emerald-900/40 flex justify-between items-center"
            >
              <div>
                <p
                  class="text-[11px] uppercase tracking-wider text-emerald-300/60 font-semibold"
                >
                  Costo Total
                </p>
                <p
                  class="text-base font-semibold text-emerald-100"
                  x-text="formatMoney(calcularTotal(prod))"
                ></p>
              </div>
              <div class="text-right">
                <p
                  class="text-[11px] uppercase tracking-wider text-crisGold font-bold"
                >
                  Precio Sugerido
                </p>
                <p
                  class="text-2xl font-black text-crisGold"
                  x-text="formatMoney(calcularPrecio(prod))"
                ></p>
              </div>
            </div>
          </div>
        </template>
      </div>

      <!-- ================= SECCIÓN 2: SEGUIMIENTO DE PEDIDOS ================= -->
      <div x-show="seccionActiva === 'pedidos'" style="display: none">
        <div class="flex justify-between items-center mb-6">
          <div>
            <h2 class="text-xl font-black text-white">
              Seguimiento de Pedidos
            </h2>
            <p class="text-xs text-emerald-300/70">
              Historial visual, etiquetas y estados de producción
            </p>
          </div>
          <button
            @click="abrirModal = true"
            class="bg-crisGold hover:bg-[#c29263] text-crisDark px-4 py-2 rounded-xl text-sm font-bold transition shadow-lg flex items-center gap-2"
          >
            <span>+ Nuevo Pedido</span>
          </button>
        </div>

        <!-- Grilla de Tarjetas de Pedidos -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
          <template x-for="p in pedidos" :key="p.id">
            <div
              class="bg-crisCard border border-emerald-900/40 rounded-3xl p-5 shadow-2xl flex flex-col justify-between relative overflow-hidden"
            >
              <!-- Cabecera de Tarjeta -->
              <div class="flex justify-between items-center mb-3">
                <span
                  class="text-[10px] uppercase font-black tracking-wider bg-crisDark text-crisGold px-2.5 py-1 rounded-xl border border-emerald-800/60"
                  x-text="p.etiqueta || 'General'"
                ></span>

                <span
                  class="text-[10px] uppercase font-bold px-2.5 py-1 rounded-full"
                  :class="{
                      'bg-yellow-900/50 text-yellow-300 border border-yellow-700/50': p.estado === 'Pendiente',
                      'bg-blue-900/50 text-blue-300 border border-blue-700/50': p.estado === 'Diseño',
                      'bg-purple-900/50 text-purple-300 border border-purple-700/50': p.estado === 'Produccion',
                      'bg-emerald-900/50 text-emerald-300 border border-emerald-700/50': p.estado === 'Listo',
                      'bg-gray-800 text-gray-400': p.estado === 'Entregado'
                  }"
                  x-text="p.estado"
                ></span>
              </div>

              <!-- Previsualización Visual del Diseño -->
              <div
                class="mb-4 rounded-2xl overflow-hidden bg-crisDark border border-emerald-900/50 h-40 flex items-center justify-center relative group"
              >
                <template x-if="p.imagen_url">
                  <img
                    :src="p.imagen_url"
                    alt="Previsualización"
                    class="w-full h-full object-cover group-hover:scale-105 transition duration-300"
                  />
                </template>
                <template x-if="!p.imagen_url">
                  <div
                    class="text-xs text-emerald-300/40 font-medium flex flex-col items-center gap-1"
                  >
                    <span>Sin imagen previa</span>
                  </div>
                </template>
              </div>

              <!-- Datos del Cliente y Detalle -->
              <div class="mb-4">
                <h3
                  class="font-bold text-white text-base mb-1"
                  x-text="p.cliente"
                ></h3>
                <p
                  class="text-sm text-emerald-200/80 line-clamp-2"
                  x-text="p.detalle"
                ></p>
                <div
                  class="mt-2 text-xs text-emerald-300/70 flex justify-between"
                >
                  <span
                    >Seña:
                    <strong
                      class="text-white"
                      x-text="'$ ' + Number(p.seña || 0).toLocaleString('es-AR')"
                    ></strong
                  ></span>
                </div>
              </div>

              <!-- Pie de Tarjeta -->
              <div
                class="pt-3 border-t border-emerald-900/40 flex justify-between items-center text-xs"
              >
                <div>
                  <span class="text-emerald-300/60">Total: </span>
                  <span
                    class="font-bold text-white"
                    x-text="'$ ' + Number(p.total).toLocaleString('es-AR')"
                  ></span>
                </div>
                <select
                  x-model="p.estado"
                  @change="actualizarEstado(p)"
                  class="bg-crisDark text-emerald-200 border border-emerald-800 rounded-xl px-2.5 py-1.5 text-xs focus:outline-none focus:border-crisGold transition"
                >
                  <option value="Pendiente">Pendiente</option>
                  <option value="Diseño">Diseño</option>
                  <option value="Produccion">Producción</option>
                  <option value="Listo">Listo</option>
                  <option value="Entregado">Entregado</option>
                </select>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- MODAL NUEVO PEDIDO -->
      <div
        x-show="abrirModal"
        class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50"
        style="display: none"
      >
        <div
          class="bg-crisCard border border-emerald-900 rounded-3xl p-6 w-full max-w-md shadow-2xl"
          @click.away="abrirModal = false"
        >
          <div
            class="flex justify-between items-center mb-4 pb-3 border-b border-emerald-900/50"
          >
            <h3 class="text-lg font-bold text-white">
              Nuevo Pedido - Cris Estampa
            </h3>
            <button
              @click="abrirModal = false"
              class="text-emerald-400 hover:text-white font-bold"
            >
              ✕
            </button>
          </div>

          <form @submit.prevent="guardarPedido()" class="space-y-4 text-xs">
            <div>
              <label class="block text-emerald-300/80 mb-1 font-semibold"
                >Cliente</label
              >
              <input
                type="text"
                x-model="nuevo.cliente"
                required
                class="w-full bg-crisDark border border-emerald-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-crisGold"
              />
            </div>
            <div>
              <label class="block text-emerald-300/80 mb-1 font-semibold"
                >Detalle del Trabajo (Prendas / Talles)</label
              >
              <textarea
                x-model="nuevo.detalle"
                required
                rows="2"
                class="w-full bg-crisDark border border-emerald-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-crisGold"
              ></textarea>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-emerald-300/80 mb-1 font-semibold"
                  >Seña ($)</label
                >
                <input
                  type="number"
                  x-model="nuevo.seña"
                  class="w-full bg-crisDark border border-emerald-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-crisGold"
                />
              </div>
              <div>
                <label class="block text-emerald-300/80 mb-1 font-semibold"
                  >Total ($)</label
                >
                <input
                  type="number"
                  x-model="nuevo.total"
                  required
                  class="w-full bg-crisDark border border-emerald-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-crisGold"
                />
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-emerald-300/80 mb-1 font-semibold"
                  >Etiqueta / Temática</label
                >
                <input
                  type="text"
                  x-model="nuevo.etiqueta"
                  placeholder="Ej: #Anime, #F1"
                  class="w-full bg-crisDark border border-emerald-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-crisGold"
                />
              </div>
              <div>
                <label class="block text-emerald-300/80 mb-1 font-semibold"
                  >URL de la Imagen (Opcional)</label
                >
                <input
                  type="text"
                  x-model="nuevo.imagen_url"
                  placeholder="https://..."
                  class="w-full bg-crisDark border border-emerald-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-crisGold"
                />
              </div>
            </div>

            <div class="pt-4 flex justify-end gap-2">
              <button
                type="button"
                @click="abrirModal = false"
                class="bg-gray-800 text-gray-300 px-4 py-2 rounded-xl font-bold"
              >
                Cancelar
              </button>
              <button
                type="submit"
                class="bg-crisGold text-crisDark px-5 py-2 rounded-xl font-bold"
              >
                Guardar Pedido
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
