<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cris Estampa - Gestor Integral de Taller</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              crisDark: "#132A20",
              crisCard: "#1C3B2E",
              crisAccent: "#E8DCC4",
              crisGold: "#D4A373",
            },
          },
        },
      };
    </script>
    <!-- Script oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://wgxvnbhkiaiewasueneo.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_s0RkJLZu1gmIyJ2Xcon5Xg_ErgG5vZP";
      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      function masterApp() {
        return {
          seccionActiva: 'calculadora', // 'calculadora', 'pedidos', 'clientes'
          productos: [],
          pedidos: [],
          clientes: [],
          mensaje: "",
          abrirModalPedido: false,
          abrirModalCliente: false,
          
          // Edición de pedido
          modoEdicion: false,
          pedidoIdEditando: null,

          nuevo: {
            cliente_id: "",
            detalle: "",
            seña: 0,
            total: 0,
            etiqueta: "General",
            imagen_url: "",
          },

          nuevoCliente: {
            nombre: "",
            telefono: "",
            email: "",
            localidad: "Rosario",
            zona: "",
            notas: ""
          },

          async init() {
            await this.cargarProductos();
            await this.cargarClientes();
            await this.cargarPedidos();
          },

          async cargarProductos() {
            try {
              let { data, error } = await supabaseClient.from("productos").select("*");
              if (error) throw error;
              this.productos = data.map((p) => ({
                id: p.id,
                nombre: p.nombre,
                costoPrenda: p.costo_prenda,
                costoDtf: p.costo_dtf,
                costoPackaging: p.costo_packaging,
                multiplicador: p.multiplicador,
              }));
            } catch (e) {
              console.error("Error al cargar productos:", e.message);
            }
          },

          async cargarClientes() {
            try {
              let { data, error } = await supabaseClient.from("clientes").select("*").order("nombre");
              if (error) throw error;
              this.clientes = data || [];
            } catch (e) {
              console.error("Error al cargar clientes:", e.message);
            }
          },

          async cargarPedidos() {
            try {
              let { data, error } = await supabaseClient.from("pedidos").select("*, clientes(nombre, telefono, localidad, zona)").order("fecha_creacion", { ascending: false });
              if (error) throw error;
              this.pedidos = data || [];
            } catch (e) {
              console.error("Error al cargar pedidos:", e.message);
            }
          },

          calcularTotal(p) {
            return (p.costoPrenda || 0) + (p.costoDtf || 0) + (p.costoPackaging || 0);
          },

          calcularPrecio(p) {
            return this.calcularTotal(p) * (p.multiplicador || 2.0);
          },

          formatMoney(val) {
            return "$ " + Math.round(val).toLocaleString("es-AR");
          },

          async guardarCambios() {
            try {
              for (let p of this.productos) {
                let { error } = await supabaseClient
                  .from("productos")
                  .update({
                    costo_prenda: p.costoPrenda,
                    costo_dtf: p.costoDtf,
                    costo_packaging: p.costoPackaging,
                    multiplicador: p.multiplicador,
                  })
                  .eq("id", p.id);
                if (error) throw error;
              }
              this.mensaje = "¡Precios actualizados y sincronizados en la nube!";
              setTimeout(() => (this.mensaje = ""), 3500);
            } catch (e) {
              console.error("Error al guardar en Supabase:", e.message);
              this.mensaje = "Hubo un error al guardar los cambios.";
            }
          },

          abrirCrearPedido() {
            this.modoEdicion = false;
            this.pedidoIdEditando = null;
            this.nuevo = { cliente_id: "", detalle: "", seña: 0, total: 0, etiqueta: "General", imagen_url: "" };
            this.abrirModalPedido = true;
          },

          prepararEdicion(p) {
            this.modoEdicion = true;
            this.pedidoIdEditando = p.id;
            this.nuevo = {
              cliente_id: p.cliente_id || "",
              detalle: p.detalle,
              seña: p.seña,
              total: p.total,
              etiqueta: p.etiqueta,
              imagen_url: p.imagen_url || ""
            };
            this.abrirModalPedido = true;
          },

          async guardarPedido() {
            try {
              let urlImagen = this.nuevo.imagen_url.trim();
              if (urlImagen.includes("drive.google.com/file/d/")) {
                let match = urlImagen.match(/\/file\/d\/([^\/]+)/);
                if (match && match[1]) {
                  urlImagen = `https://drive.google.com/uc?export=view&id=${match[1]}`;
                }
              }

              let payload = {
                cliente_id: this.nuevo.cliente_id || null,
                detalle: this.nuevo.detalle,
                seña: Number(this.nuevo.seña) || 0,
                total: Number(this.nuevo.total) || 0,
                etiqueta: this.nuevo.etiqueta || 'General',
                imagen_url: urlImagen || null,
              };

              if (this.modoEdicion) {
                let { error } = await supabaseClient.from("pedidos").update(payload).eq("id", this.pedidoIdEditando);
                if (error) throw error;
                this.mensaje = "¡Pedido actualizado con éxito!";
              } else {
                payload.estado = 'Pendiente';
                let { error } = await supabaseClient.from("pedidos").insert([payload]);
                if (error) throw error;
                this.mensaje = "¡Pedido guardado con éxito!";
              }

              this.abrirModalPedido = false;
              await this.cargarPedidos();
              setTimeout(() => (this.mensaje = ""), 3500);
            } catch (e) {
              console.error("Error al guardar pedido:", e.message);
              alert("Error al guardar el pedido. Verificá los datos.");
            }
          },

          async eliminarPedido(id) {
            if (confirm("¿Estás seguro de que querés eliminar este pedido?")) {
              let { error } = await supabaseClient.from("pedidos").delete().eq("id", id);
              if (!error) {
                this.pedidos = this.pedidos.filter(p => p.id !== id);
                this.mensaje = "Pedido eliminado.";
                setTimeout(() => (this.mensaje = ""), 3000);
              }
            }
          },

          async guardarClienteNuevo() {
            try {
              let { data, error } = await supabaseClient.from("clientes").insert([this.nuevoCliente]).select();
              if (error) throw error;
              if (data) {
                this.clientes.push(data[0]);
                this.nuevo.cliente_id = data[0].id; // Lo seleccionamos automáticamente en el pedido
                this.nuevoCliente = { nombre: "", telefono: "", email: "", localidad: "Rosario", zona: "", notas: "" };
                this.abrirModalCliente = false;
                this.mensaje = "¡Cliente registrado con éxito!";
                setTimeout(() => (this.mensaje = ""), 3500);
              }
            } catch (e) {
              console.error("Error al guardar cliente:", e.message);
              alert("Error al registrar el cliente.");
            }
          },

          async actualizarEstado(p) {
            await supabaseClient.from("pedidos").update({ estado: p.estado }).eq("id", p.id);
          }
        };
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="apple-touch-icon" href="logo.svg" />
  </head>
  <body class="bg-crisDark text-crisAccent min-h-screen font-sans antialiased selection:bg-crisGold selection:text-crisDark" x-data="masterApp()">
    
    <div class="max-w-4xl mx-auto px-4 py-6">
      
      <!-- HEADER CON IDENTIDAD Y ACCIONES -->
      <header class="flex flex-col sm:flex-row justify-between items-center mb-6 border-b border-emerald-900/50 pb-6 gap-4">
        <div class="flex items-center gap-3">
          <img src="logo.svg" alt="Cris Estampa Logo" class="w-12 h-12 rounded-2xl shadow-lg object-contain bg-crisAccent/10 p-1" />
          <div>
            <h1 class="text-2xl font-black tracking-wider text-white">
              CRIS <span class="text-crisGold font-medium text-lg">estampa</span>
            </h1>
            <p class="text-xs text-emerald-300/70">Gestor Integral de Taller</p>
          </div>
        </div>

        <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
          <button @click="abrirCrearPedido()" class="bg-crisGold hover:bg-[#c29263] text-crisDark px-4 py-2.5 rounded-xl text-sm font-bold transition shadow-lg flex items-center gap-2">
            <span>+ Pedido</span>
          </button>
          
          <template x-if="seccionActiva === 'calculadora'">
            <button @click="guardarCambios()" class="bg-emerald-800 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-sm font-bold transition shadow-lg">
              Guardar Precios
            </button>
          </template>
        </div>
      </header>

      <!-- BARRA DE PESTAÑAS (MENÚ) -->
      <div class="flex bg-crisCard p-1.5 rounded-2xl border border-emerald-900/60 mb-6 shadow-xl">
        <button @click="seccionActiva = 'calculadora'" 
          :class="seccionActiva === 'calculadora' ? 'bg-crisDark text-crisGold shadow-md font-bold' : 'text-emerald-300/70 hover:text-white'"
          class="flex-1 py-2.5 rounded-xl text-xs sm:text-sm transition text-center uppercase tracking-wider">
          🧮 Calculadora
        </button>
        <button @click="seccionActiva = 'pedidos'" 
          :class="seccionActiva === 'pedidos' ? 'bg-crisDark text-crisGold shadow-md font-bold' : 'text-emerald-300/70 hover:text-white'"
          class="flex-1 py-2.5 rounded-xl text-xs sm:text-sm transition text-center uppercase tracking-wider">
          📦 Pedidos
        </button>
        <button @click="seccionActiva = 'clientes'" 
          :class="seccionActiva === 'clientes' ? 'bg-crisDark text-crisGold shadow-md font-bold' : 'text-emerald-300/70 hover:text-white'"
          class="flex-1 py-2.5 rounded-xl text-xs sm:text-sm transition text-center uppercase tracking-wider">
          📇 Clientes
        </button>
      </div>

      <!-- MENSAJE DE ÉXITO FLOTANTE -->
      <div x-show="mensaje" x-transition class="mb-6 p-4 bg-emerald-900/90 border border-emerald-500/40 text-emerald-200 text-sm rounded-2xl text-center shadow-xl" x-text="mensaje"></div>

      <!-- ================= SECCIÓN 1: CALCULADORA ================= -->
      <div x-show="seccionActiva === 'calculadora'" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <template x-for="(prod, index) in productos" :key="prod.id">
          <div class="bg-crisCard border border-emerald-900/40 rounded-3xl p-6 shadow-2xl backdrop-blur-md relative overflow-hidden">
            <h2 class="text-lg font-bold text-white mb-4 border-b border-emerald-900/40 pb-2" x-text="prod.nombre"></h2>

            <div class="space-y-3 text-sm">
              <div class="flex justify-between items-center">
                <span class="text-emerald-200/70">Costo Prenda ($):</span>
                <input type="number" x-model.number="prod.costoPrenda" class="bg-crisDark border border-emerald-800/60 rounded-xl px-3 py-1.5 w-32 text-right text-white font-medium focus:outline-none focus:border-crisGold transition" />
              </div>
              <div class="flex justify-between items-center">
                <span class="text-emerald-200/70">Costo DTF ($):</span>
                <input type="number" x-model.number="prod.costoDtf" class="bg-crisDark border border-emerald-800/60 rounded-xl px-3 py-1.5 w-32 text-right text-white font-medium focus:outline-none focus:border-crisGold transition" />
              </div>
              <div class="flex justify-between items-center">
                <span class="text-emerald-200/70">Packaging ($):</span>
                <input type="number" x-model.number="prod.costoPackaging" class="bg-crisDark border border-emerald-800/60 rounded-xl px-3 py-1.5 w-32 text-right text-white/50 font-medium cursor-not-allowed" disabled />
              </div>
              <div class="flex justify-between items-center">
                <span class="text-emerald-200/70">Multiplicador (Margen):</span>
                <input type="number" step="0.1" x-model.number="prod.multiplicador" class="bg-crisDark border border-emerald-800/60 rounded-xl px-3 py-1.5 w-32 text-right text-white font-medium focus:outline-none focus:border-crisGold transition" />
              </div>
            </div>

            <div class="mt-6 pt-4 border-t border-emerald-900/40 flex justify-between items-center">
              <div>
                <p class="text-[11px] uppercase tracking-wider text-emerald-300/60 font-semibold">Costo Total</p>
                <p class="text-base font-semibold text-emerald-100" x-text="formatMoney(calcularTotal(prod))"></p>
              </div>
              <div class="text-right">
                <p class="text-[11px] uppercase tracking-wider text-crisGold font-bold">Precio Sugerido</p>
                <p class="text-2xl font-black text-crisGold" x-text="formatMoney(calcularPrecio(prod))"></p>
              </div>
            </div>
          </div>
        </template>
      </div>

      <!-- ================= SECCIÓN 2: SEGUIMIENTO DE PEDIDOS ================= -->
      <div x-show="seccionActiva === 'pedidos'" style="display: none;">
        <div class="flex justify-between items-center mb-6">
          <div>
            <h2 class="text-xl font-black text-white">Seguimiento de Pedidos</h2>
            <p class="text-xs text-emerald-300/70">Historial visual, etiquetas y estados de producción</p>
          </div>
          <button @click="abrirCrearPedido()" class="bg-crisGold hover:bg-[#c29263] text-crisDark px-4 py-2 rounded-xl text-sm font-bold transition shadow-lg flex items-center gap-2">
            <span>+ Nuevo Pedido</span>
          </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
          <template x-for="p in pedidos" :key="p.id">
            <div class="bg-crisCard border border-emerald-900/40 rounded-3xl p-5 shadow-2xl flex flex-col justify-between relative overflow-hidden">
              
              <!-- Cabecera de Tarjeta -->
              <div>
                <div class="flex justify-between items-center mb-3">
                  <span class="text-[10px] uppercase font-black tracking-wider bg-crisDark text-crisGold px-2.5 py-1 rounded-xl border border-emerald-800/60" x-text="p.etiqueta || 'General'"></span>
                  
                  <div class="flex items-center gap-2">
                    <span class="text-[10px] uppercase font-bold px-2.5 py-1 rounded-full"
                      :class="{
                          'bg-yellow-900/50 text-yellow-300 border border-yellow-700/50': p.estado === 'Pendiente',
                          'bg-blue-900/50 text-blue-300 border border-blue-700/50': p.estado === 'Diseño',
                          'bg-purple-900/50 text-purple-300 border border-purple-700/50': p.estado === 'Produccion',
                          'bg-emerald-900/50 text-emerald-300 border border-emerald-700/50': p.estado === 'Listo',
                          'bg-gray-800 text-gray-400': p.estado === 'Entregado'
                      }" x-text="p.estado"></span>
                  </div>
                </div>

                <!-- Previsualización Visual -->
                <div class="mb-4 rounded-2xl overflow-hidden bg-crisDark border border-emerald-900/50 h-36 flex items-center justify-center relative group">
                  <template x-if="p.imagen_url">
                    <img :src="p.imagen_url" alt="Previsualización" class="w-full h-full object-cover" />
                  </template>
                  <template x-if="!p.imagen_url">
                    <div class="text-xs text-emerald-300/40 font-medium">Sin imagen previa</div>
                  </template>
                </div>

                <!-- Datos del Cliente y Detalle -->
                <div class="mb-4">
                  <h3 class="font-bold text-white text-base mb-0.5" x-text="p.clientes ? p.clientes.nombre : 'Cliente Genérico'"></h3>
                  <p class="text-xs text-crisGold mb-2" x-text="p.clientes ? (p.clientes.localidad + (p.clientes.zona ? ' (' + p.clientes.zona + ')' : '')) : ''"></p>
                  <p class="text-sm text-emerald-200/80 line-clamp-2" x-text="p.detalle"></p>
                  <div class="mt-2 text-xs text-emerald-300/70 flex justify-between">
                    <span>Seña: <strong class="text-white" x-text="'$ ' + Number(p.seña || 0).toLocaleString('es-AR')"></strong></span>
                  </div>
                </div>
              </div>

              <!-- Pie de Tarjeta (Estado, Editar, Eliminar) -->
              <div class="pt-3 border-t border-emerald-900/40 flex flex-col gap-2 text-xs">
                <div class="flex justify-between items-center">
                  <div>
                    <span class="text-emerald-300/60">Total: </span>
                    <span class="font-bold text-white" x-text="'$ ' + Number(p.total).toLocaleString('es-AR')"></span>
                  </div>
                  <select x-model="p.estado" @change="actualizarEstado(p)" class="bg-crisDark text-emerald-200 border border-emerald-800 rounded-xl px-2.5 py-1.5 text-xs focus:outline-none focus:border-crisGold transition">
                    <option value="Pendiente">Pendiente</option>
                    <option value="Diseño">Diseño</option>
                    <option value="Produccion">Producción</option>
                    <option value="Listo">Listo</option>
                    <option value="Entregado">Entregado</option>
                  </select>
                </div>
                <div class="flex justify-end gap-2 pt-1">
                  <button @click="prepararEdicion(p)" class="text-emerald-300 hover:text-white bg-emerald-950 px-3 py-1 rounded-lg border border-emerald-800">Editar</button>
                  <button @click="eliminarPedido(p.id)" class="text-red-300 hover:text-red-100 bg-red-950/60 px-3 py-1 rounded-lg border border-red-900">Eliminar</button>
                </div>
              </div>

            </div>
          </template>
        </div>
      </div>

      <!-- ================= SECCIÓN 3: AGENDA DE CLIENTES ================= -->
      <div x-show="seccionActiva === 'clientes'" style="display: none;">
        <div class="flex justify-between items-center mb-6">
          <div>
            <h2 class="text-xl font-black text-white">Agenda de Clientes</h2>
            <p class="text-xs text-emerald-300/70">Directorio y zonas de envío</p>
          </div>
          <button @click="abrirModalCliente = true" class="bg-crisGold hover:bg-[#c29263] text-crisDark px-4 py-2 rounded-xl text-sm font-bold transition shadow-lg flex items-center gap-2">
            <span>+ Nuevo Cliente</span>
          </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <template x-for="c in clientes" :key="c.id">
            <div class="bg-crisCard border border-emerald-900/40 rounded-2xl p-4 shadow-xl flex flex-col justify-between">
              <div>
                <div class="flex justify-between items-start mb-1">
                  <h3 class="font-bold text-white text-base" x-text="c.nombre"></h3>
                  <span class="text-[10px] bg-crisDark text-crisGold px-2 py-0.5 rounded-lg border border-emerald-800" x-text="c.localidad"></span>
                </div>
                <p class="text-xs text-emerald-300/80 mb-2" x-text="c.zona ? 'Zona: ' + c.zona : 'Sin zona especificada'"></p>
                <p class="text-xs text-emerald-200/60 mb-1" x-text="c.telefono ? '📞 ' + c.telefono : 'Sin teléfono'"></p>
                <p class="text-xs text-emerald-200/60 mb-3" x-text="c.email ? '✉️ ' + c.email : ''"></p>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- MODAL CREAR / EDITAR PEDIDO -->
      <div x-show="abrirModalPedido" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" style="display: none;">
        <div class="bg-crisCard border border-emerald-900 rounded-3xl p-6 w-full max-w-md shadow-2xl" @click.away="abrirModalPedido = false">
          <div class="flex justify-between items-center mb-4 pb-3 border-b border-emerald-900/50">
            <h3 class="text-lg font-bold text-white" x-text="modoEdicion ? 'Editar Pedido' : 'Nuevo Pedido - Cris Estampa'"></h3>
            <button @click="abrirModalPedido = false" class="text-emerald-400 hover:text-white font-bold">✕</button>
          </div>

          <form @submit.prevent="guardarPedido()" class="space-y-4 text-xs">
            <div>
              <div class="flex justify-between items-center mb-1">
                <label class="text-emerald-300/80 font-semibold">Cliente</label>
                <button type="button" @click="abrirModalCliente = true" class="text-crisGold hover:underline font-bold">+ Cargar Cliente Nuevo</button>
              </div>
              <select x-model="nuevo.cliente_id" required class="w-full bg-crisDark border border-emerald-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-crisGold">
                <option value="">Seleccionar Cliente...</option>
                <template x-for="c in clientes" :key="c.id">
                  <option :value="c.id" x-text="c.nombre + ' (' + c.localidad + (c.zona ? ' - ' + c.zona : '') + ')'"></option>
                </template>
              </select>
            </div>

            <div>
              <label class="block text-emerald-300/80 mb-1 font-semibold">Detalle del Trabajo (Prendas / Talles)</label>
              <textarea x-model="nuevo.detalle" required rows="2" class="w-full bg-crisDark border border-emerald-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-crisGold"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-emerald-300/80 mb-1 font-semibold">Seña ($)</label>
                <input type="number" x-model="nuevo.seña" class="w-full bg-crisDark border border-emerald-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-crisGold" />
              </div>
              <div>
                <label class="block text-emerald-300/80 mb-1 font-semibold">Total ($)</label>
                <input type="number" x-model="nuevo.total" required class="w-full bg-crisDark border border-emerald-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-crisGold" />
              </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-emerald-300/80 mb-1 font-semibold">Etiqueta / Temática</label>
                <input type="text" x-model="nuevo.etiqueta" placeholder="Ej: #Anime, #F1" class="w-full bg-crisDark border border-emerald-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-crisGold" />
              </div>
              <div>
                <label class="block text-emerald-300/80 mb-1 font-semibold">URL de la Imagen</label>
                <input type="text" x-model="nuevo.imagen_url" placeholder="https://..." class="w-full bg-crisDark border border-emerald-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-crisGold" />
              </div>
            </div>

            <div class="pt-4 flex justify-end gap-2">
              <button type="button" @click="abrirModalPedido = false" class="bg-gray-800 text-gray-300 px-4 py-2 rounded-xl font-bold">Cancelar</button>
              <button type="submit" class="bg-crisGold text-crisDark px-5 py-2 rounded-xl font-bold" x-text="modoEdicion ? 'Actualizar Pedido' : 'Guardar Pedido'"></button>
            </div>
          </form>
        </div>
      </div>

      <!-- MODAL NUEVO CLIENTE -->
      <div x-show="abrirModalCliente" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50" style="display: none;">
        <div class="bg-crisCard border border-emerald-900 rounded-3xl p-6 w-full max-w-md shadow-2xl" @click.away="abrirModalCliente = false">
          <div class="flex justify-between items-center mb-4 pb-3 border-b border-emerald-900/50">
            <h3 class="text-lg font-bold text-white">Nuevo Cliente</h3>
            <button @click="abrirModalCliente = false" class="text-emerald-400 hover:text-white font-bold">✕</button>
          </div>

          <form @submit.prevent="guardarClienteNuevo()" class="space-y-4 text-xs">
            <div>
              <label class="block text-emerald-300/80 mb-1 font-semibold">Nombre y Apellido / Empresa</label>
              <input type="text" x-model="nuevoCliente.nombre" required class="w-full bg-crisDark border border-emerald-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-crisGold" />
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-emerald-300/80 mb-1 font-semibold">Teléfono / WhatsApp</label>
                <input type="text" x-model="nuevoCliente.telefono" class="w-full bg-crisDark border border-emerald-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-crisGold" />
              </div>
              <div>
                <label class="block text-emerald-300/80 mb-1 font-semibold">Ciudad / Localidad</label>
                <input type="text" x-model="nuevoCliente.localidad" class="w-full bg-crisDark border border-emerald-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-crisGold" />
              </div>
            </div>
            <div>
              <label class="block text-emerald-300/80 mb-1 font-semibold">Zona / Barrio (Ej: Centro, Echesortu, Funes)</label>
              <input type="text" x-model="nuevoCliente.zona" class="w-full bg-crisDark border border-emerald-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-crisGold" />
            </div>

            <div class="pt-4 flex justify-end gap-2">
              <button type="button" @click="abrirModalCliente = false" class="bg-gray-800 text-gray-300 px-4 py-2 rounded-xl font-bold">Cancelar</button>
              <button type="submit" class="bg-crisGold text-crisDark px-5 py-2 rounded-xl font-bold">Guardar Cliente</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </body>
</html>
